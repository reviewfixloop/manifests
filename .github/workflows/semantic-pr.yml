name: Semantic PR
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  pull-requests: read
jobs:
  semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'EOF'
          const title = process.env.PR_TITLE ?? '';
          const allowedTypes = new Set([
            'build',
            'chore',
            'ci',
            'docs',
            'feat',
            'fix',
            'perf',
            'refactor',
            'revert',
            'style',
            'test',
          ]);
          const releasingTypes = new Set(['docs', 'feat', 'fix', 'perf', 'revert']);

          if (/[\r\n\x00-\x1f\x7f]/.test(title)) {
            console.error(`PR title must be a single line without control characters: ${JSON.stringify(title)}`);
            process.exit(1);
          }

          const match = /^([a-z]+)(?:\(([^()\r\n]+)\))?(!?): (.+)$/.exec(title);
          if (match === null) {
            console.error(
              `PR title must follow Conventional Commits ("<type>[optional scope]: <description>"): ${title}`,
            );
            process.exit(1);
          }

          const [, type = '', , bang = '', subject = ''] = match;
          if (!allowedTypes.has(type)) {
            console.error(`Unsupported Conventional Commit type "${type}". Allowed: ${[...allowedTypes].join(', ')}`);
            process.exit(1);
          }

          if (subject !== subject.trim()) {
            console.error('PR title description must not have leading or trailing whitespace.');
            process.exit(1);
          }

          if (!/[A-Za-z]/.test(subject) || !/^[\x20-\x7e–—‘’“”…→]+$/u.test(title)) {
            console.error(`PR title must be written in English only: ${title}`);
            process.exit(1);
          }

          if (bang !== '!' && !releasingTypes.has(type) && process.env.GITHUB_REPOSITORY && process.env.PR_NUMBER) {
            const headers = {
              Accept: 'application/vnd.github+json',
              'User-Agent': 'semantic-pr-check',
              ...(process.env.GITHUB_TOKEN ? { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` } : {}),
            };
            const shippedFiles = [];
            for (let page = 1; ; page += 1) {
              const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}/files?per_page=100&page=${page}`;
              const res = await fetch(url, { headers });
              if (!res.ok) {
                console.error(`Failed to fetch PR files (${res.status}): ${await res.text()}`);
                process.exit(1);
              }
              const files = await res.json();
              for (const file of files) {
                for (const candidate of [file.filename, file.previous_filename]) {
                  if (
                    typeof candidate === 'string' &&
                    (candidate.startsWith('official/') || candidate === 'scripts/build.ts')
                  ) {
                    shippedFiles.push(candidate);
                  }
                }
              }
              if (files.length < 100) break;
            }
            if (shippedFiles.length > 0) {
              console.error(
                `PRs modifying shipped manifest files (${[...new Set(shippedFiles)].join(', ')}) must use a releasing type (${[...releasingTypes].join(', ')}, or "!"): ${title}`,
              );
              process.exit(1);
            }
          }

          console.log(`Valid PR title: ${title}`);
          EOF
